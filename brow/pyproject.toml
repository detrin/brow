[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brow-cli"
version = "0.1.0"
description = "Standalone Playwright CLI for agent browser automation"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "typer>=0.9",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25",
]

[project.scripts]
brow = "brow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/brow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
